version: "3.9"

services:

  # ── Flask API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: helpdesk-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: helpdesk-pro-secure-key-2026
      # Point to your real RDS instance (or override with a local postgres below)
      DB_HOST: ${DB_HOST:-helpdesk-db.cvoymkeyimfo.eu-north-1.rds.amazonaws.com}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-hjhjhjhj}
      DB_NAME: ${DB_NAME:-helpdesk}
      DB_PORT: ${DB_PORT:-5432}
      FRONTEND_URL: http://localhost
    ports:
      - "8080:8080"    # also directly accessible for debugging
    networks:
      - helpdesk-net

  # ── React SPA served by nginx ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: helpdesk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - helpdesk-net

  # ── Reverse proxy (local only) ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: helpdesk-nginx
    restart: unless-stopped
    ports:
      - "80:80"         # main entry point: http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge
