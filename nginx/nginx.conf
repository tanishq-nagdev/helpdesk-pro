# This nginx is only used for LOCAL docker-compose testing.
# It sits in front of both containers on port 80, so your browser
# hits one URL (http://localhost) and everything works.
#
# In production on AWS, the ALB handles routing instead of this file.

events { worker_connections 1024; }

http {
    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;

        # API traffic → backend
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_pass_header  Set-Cookie;
        }

        # Everything else → React frontend
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
        }
    }
}
