server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy /api/* → backend service ──────────────────────────────────────
    # In production on ECS, BACKEND_URL will be the backend ALB/service DNS.
    # We use an nginx variable so nginx doesn't crash at startup if the backend
    # isn't resolvable yet.
    location /api/ {
        # BACKEND_HOST is substituted by the entrypoint (or set at build time).
        # Default: "backend" resolves inside docker-compose network.
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward cookies (required for Flask sessions)
        proxy_pass_header  Set-Cookie;
    }

    # ── React SPA: send all other paths to index.html ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
