server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Force Nginx to recognize Javascript and CSS correctly
    include /etc/nginx/mime.types;

    # 2. Serve static assets directly. If missing, throw 404, DO NOT send index.html
    location /assets/ {
        try_files $uri =404;
    }

    # 3. React Router: send all other paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
